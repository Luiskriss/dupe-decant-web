<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dupe Decant</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js" defer></script>
<body>
    <header>
        <h1>Dupe Decant</h1></header>
    <main>
        <h2>Catálogo</h2>
        <section class="catalogo" id="catalogo"></section>
        <h2>Tu pedido</h2>
        <ul id="lista-pedido"></ul>
        <p id="total">Total: Q0</p>
        <section id="datos-cliente">
            <h3>Tus Datos</h3>
            <input type="text" id="nombre-cliente" placeholder="Tu nombre">
            <input type="tel" id="telefono-cliente" placeholder="Tu teléfono">
            <select id="modalidad">
                <option value="entrega">Entrega a domicilio</option>
                <option value="recoger">Paso a recoger</option>
            </select>
            <input type="text" id="zona-cliente" placeholder="Zona o dirección de entrega">
            <textarea id="notas-cliente" placeholder = "Notas (opcional)"></textarea>
            <p class="aviso-pago">El pago se hace al recibir o al recoger tu pedido. No se cobra nada en esta página.</p>
        </section>
        <button id="enviar">Enviar pedido por WhatsApp</button>
        <button id="vaciar">Vaciar pedido</button>
    </main>

    <footer>
        <p>&copy; Decants de fragancias en Guatemala</p>
    </footer>

</body>
</html>
